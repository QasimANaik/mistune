# Experiment E1 "weak reviewer": read-only, cannot run anything.

[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "grep_search"]
decision = "allow"
priority = 100

[[rule]]
toolName = ["write_file", "replace", "run_shell_command", "web_fetch", "google_web_search", "activate_skill"]
decision = "deny"
priority = 999
denyMessage = "AutoSE: this reviewer variant can only read code."
